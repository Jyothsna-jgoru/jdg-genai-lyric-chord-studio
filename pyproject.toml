[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jdg-genai-lyric-chord-studio"
version = "1.0.0"
description = "Local FLAN-T5 + LoRA lyric-to-chord generation studio"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Jyothsna Devi Goru"}]
dependencies = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mido>=1.3,<2",
  "mlflow-skinny>=2.19,<4",
  "peft>=0.14,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8"]

[project.scripts]
jdg-studio = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --basetemp=.pytest_tmp"
markers = ["model: requires the locally downloaded FLAN-T5 model and trained adapter"]
