base_model = "google/flan-t5-small"
dataset_dir = "data/generated/dev"
output_dir = "storage/adapters/dev"
checkpoint_dir = "checkpoints/dev"
seed = 42
lora_rank = 8
lora_alpha = 16
lora_dropout = 0.05
target_modules = ["q", "v"]
max_input_length = 512
max_output_length = 256
learning_rate = 0.0008
warmup_ratio = 0.05
weight_decay = 0.01
epochs = 1
max_steps = 80
batch_size = 1
gradient_accumulation_steps = 1
eval_steps = 40
save_steps = 40
logging_steps = 10
early_stopping_patience = 2
mixed_precision = "auto"
mlflow = false
